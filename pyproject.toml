[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemlite"
version = "1.0.0"
description = "Gemini API client with a Rust/ctypes core - HTTP, file uploads, and multi-key failover compiled to a small native library, driven from a thin Python wrapper."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["wcwidth>=0.2.5"]

[project.urls]
Homepage = "https://github.com/your-org/gemlite"

[project.scripts]
gemlite = "gemlite.core:main"

[tool.setuptools]
packages = ["gemlite"]
package-dir = { "gemlite" = "." }
include-package-data = true

[tool.setuptools.package-data]
gemlite = ["lib/*.so", "lib/*.dll"]
